<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADM | WINDS-DEV</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { background-color: #f6f3eb; color: #222222; padding: 20px; }

.admin-container { max-width: 800px; margin: 0 auto; }
.admin-title { text-align: center; font-size: 2rem; font-weight: 900; color: #e63946; margin-bottom: 25px; letter-spacing: 1px; text-transform: uppercase; }

.search-box { position: relative; margin-bottom: 15px; }
.search-box input { width: 100%; padding: 14px 20px 14px 45px; background: #ffffff; border: 1px solid #dcd3c1; border-radius: 12px; font-size: 1rem; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
.search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #666055; font-size: 1.1rem; }

.filters-bar { display: flex; gap: 10px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; }
.filter-btn { background: #eae4d7; border: 1px solid #dcd3c1; color: #222222; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s; white-space: nowrap; }
.filter-btn.active, .filter-btn:hover { background: #e63946; color: #ffffff; border-color: #e63946; }

.tickets-list { display: flex; flex-direction: column; gap: 20px; }

.ticket-card { background: #ffffff; border: 1px solid #dcd3c1; border-radius: 12px; padding: 20px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: relative; border-left: 6px solid #e63946; }
.ticket-card.tech { border-left-color: #ffb703; }
.ticket-card.report { border-left-color: #e63946; }

.ticket-header { font-size: 1.2rem; font-weight: 800; color: #1a1a1a; margin-bottom: 12px; }
.ticket-info { font-size: 0.95rem; color: #444444; margin-bottom: 8px; line-height: 1.5; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticket-info strong { color: #111111; font-weight: 700; }

/* Status Badge Styles */
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 5px; }
.badge-unchecked { background-color: #f97316; } 
.badge-waiting { background-color: #eab308; }   
.badge-closed { background-color: #ef4444; }    

.ticket-actions { margin-top: 15px; display: flex; gap: 10px; border-top: 1px solid #f0ede6; padding-top: 12px; flex-wrap: wrap; }
.action-btn { padding: 8px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; color: #ffffff; transition: 0.2s; }
.btn-review { background-color: #e63946; } 
.btn-review:hover { background-color: #d62828; }
.btn-close-action { background-color: #f97316; } 
.btn-close-action:hover { background-color: #ea580c; }

/* Review Detail View Styles */
#reviewDetailView { display: none; background: #ffffff; border: 1px solid #dcd3c1; border-radius: 16px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.back-btn { display: inline-flex; align-items: center; gap: 8px; background: #eae4d7; border: 1px solid #dcd3c1; color: #222; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
.review-content { font-size: 1.05rem; line-height: 1.6; color: #333; margin-bottom: 25px; }
.review-content p { margin-bottom: 12px; }
.review-content strong { color: #111; font-weight: 800; }

.btn-green-answer { background-color: #22c55e; color: #ffffff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; float: right; transition: 0.2s; }
.btn-green-answer:hover { background-color: #16a34a; }

.answer-box-wrap { display: none; margin-top: 25px; border-top: 1px solid #dcd3c1; padding-top: 20px; }
.answer-box-wrap textarea { width: 100%; height: 150px; padding: 15px; border: 1px solid #dcd3c1; border-radius: 10px; font-size: 1rem; outline: none; resize: vertical; margin-bottom: 15px; }
.btn-send-mail { background-color: #e63946; color: #ffffff; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; float: right; transition: 0.2s; }
.btn-send-mail:hover { background-color: #d62828; }

.no-tickets { text-align: center; padding: 40px; color: #666055; font-size: 1.1rem; font-weight: 600; background: #ffffff; border-radius: 12px; border: 1px solid #dcd3c1; }
</style>
</head>
<body>

<div class="admin-container">
    <h1 class="admin-title">ADM | WINDS-DEV</h1>

    <!-- MAIN DASHBOARD VIEW -->
    <div id="mainDashboardView">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="adminSearch" placeholder="Search by name, email, or issue..." oninput="filterTickets()">
        </div>

        <div class="filters-bar">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('Tech-Issue', this)">Tech-Issue</button>
            <button class="filter-btn" onclick="setFilter('Report', this)">Report</button>
        </div>

        <div class="tickets-list" id="ticketsContainer">
            <!-- Tickets loaded dynamically -->
        </div>
    </div>

    <!-- REVIEW DETAIL VIEW -->
    <div id="reviewDetailView">
        <button class="back-btn" onclick="goBackToDashboard()"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>
        <div class="review-content" id="reviewContentBody">
            <!-- Dynamic Ticket Details -->
        </div>
    </div>
</div>

<script>
let currentFilter = 'all';
let currentActiveTicketId = null;

function loadTickets() {
    const container = document.getElementById('ticketsContainer');
    
    const dummyTickets = [
        { id: 1, type: 'Tech-Issue', name: 'Sadiq_Ahmed', email: 'notsk342@gmail.com', issue: 'WEBSITE ISSUE', time: '30/10/2026, 14:00:00', status: ['unchecked', 'waiting'], desc: 'Google login redirect issue on mobile browser while testing kiwi browser.' },
        { id: 2, type: 'Report', name: 'THUNDER', email: 'player123@gmail.com', issue: 'HACKING / CHEATING', time: '30/10/2026, 14:05:00', status: ['unchecked', 'waiting'], desc: 'Player was using speedhack in match near training ground.' }
    ];
    
    if (!localStorage.getItem('winds_tickets')) {
        localStorage.setItem('winds_tickets', JSON.stringify(dummyTickets));
    }

    let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];
    container.innerHTML = '';
    const searchQuery = document.getElementById('adminSearch').value.toLowerCase();

    const filtered = tickets.filter(t => {
        const matchesFilter = currentFilter === 'all' || t.type === currentFilter;
        const matchesSearch = t.name.toLowerCase().includes(searchQuery) || 
                              t.email.toLowerCase().includes(searchQuery) || 
                              t.issue.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="no-tickets">No tickets found.</div>`;
        return;
    }

    filtered.forEach((t) => {
        const cardClass = t.type === 'Tech-Issue' ? 'tech' : 'report';
        
        let statusHTML = '';
        if (t.status === 'Closed' || t.status === 'closed') {
            statusHTML = `<span class="badge badge-closed">Closed</span>`;
        } else {
            statusHTML = `<span class="badge badge-unchecked">unchecked</span> <span class="badge badge-waiting">waiting</span>`;
        }

        const card = document.createElement('div');
        card.className = `ticket-card ${cardClass}`;
        card.innerHTML = `
            <div class="ticket-header">#${t.id} - ${t.name}</div>
            <div class="ticket-info"><strong>Email -</strong> ${t.email}</div>
            <div class="ticket-info"><strong>Issue -</strong> ${t.issue}</div>
            <div class="ticket-info"><strong>Time -</strong> ${t.time}</div>
            <div class="ticket-info"><strong>Status -</strong> ${statusHTML}</div>
            
            <div class="ticket-actions">
                <button class="action-btn btn-review" onclick="openReview(${t.id})">Review</button>
                <button class="action-btn btn-close-action" onclick="updateStatus(${t.id}, 'close')">Close</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function openReview(id) {
    currentActiveTicketId = id;
    let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];
    const t = tickets.find(ticket => ticket.id === id);
    if (!t) return;

    document.getElementById('mainDashboardView').style.display = 'none';
    document.getElementById('reviewDetailView').style.display = 'block';

    const reviewBody = document.getElementById('reviewContentBody');
    reviewBody.innerHTML = `
        <p><strong>USER NAME -</strong> ${t.name}</p>
        <p><strong>USER ISSUE -</strong> ${t.issue}</p>
        <p><strong>DESCRIPTION -</strong><br>${t.desc || 'No description provided.'}</p>
        <div style="margin-top: 20px; overflow: hidden;">
            <button class="btn-green-answer" onclick="toggleAnswerBox()">Answer</button>
        </div>
        <div class="answer-box-wrap" id="answerBoxContainer">
            <textarea id="adminAnswerText" placeholder="Write your answer here..."></textarea>
            <div style="overflow: hidden;">
                <button class="btn-send-mail" onclick="sendAnswerMail('${t.email}', '${t.name}')">SEND</button>
            </div>
        </div>
    `;
    window.scrollTo(0, 0);
}

function toggleAnswerBox() {
    const box = document.getElementById('answerBoxContainer');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

// Resend API Integration Function
function sendAnswerMail(userEmail, userName) {
    const answerText = document.getElementById('adminAnswerText').value;
    if (!answerText.trim()) {
        alert('Please write an answer before sending!');
        return;
    }

    const RESEND_API_KEY = 're_iP3Vzzvu_DGBCStk3i4BDxPxz5ireSLAK';

    const payload = {
        from: 'WINDS Development <onboarding@resend.dev>',
        to: [userEmail],
        subject: 'Response to your Support Ticket | WINDS-DEV',
        html: `
            <div style="font-family: Arial, sans-serif; color: #222222; padding: 20px; line-height: 1.6;">
                <p>Hello Dear,</p>
                <p><strong>${userName}</strong></p>
                <div style="margin: 20px 0; font-size: 1rem; color: #333333;">
                    ${answerText}
                </div>
                <div style="margin-top: 30px;">
                    <a href="https://dc.gg/winds.dev" target="_blank" style="background-color: #e63946; color: #ffffff; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 6px; display: inline-block;">
                        MEET US
                    </a>
                </div>
            </div>
        `
    };

    fetch('https://api.resend.com/emails', {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${RESEND_API_KEY}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if (data.id) {
            alert('Mail sent successfully via Resend!');
            
            let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];
            tickets = tickets.map(t => {
                if (t.id === currentActiveTicketId) {
                    t.status = 'Closed';
                }
                return t;
            });
            localStorage.setItem('winds_tickets', JSON.stringify(tickets));

            goBackToDashboard();
        } else {
            alert('RESEND ERROR: ' + JSON.stringify(data));
        }
    })
    .catch(error => {
        alert('FETCH ERROR: ' + error.message);
    });
}

function goBackToDashboard() {
    document.getElementById('reviewDetailView').style.display = 'none';
    document.getElementById('mainDashboardView').style.display = 'block';
    currentActiveTicketId = null;
    loadTickets();
}

function updateStatus(id, action) {
    let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];
    tickets = tickets.map(t => {
        if (t.id === id) {
            if (action === 'close') {
                t.status = 'Closed';
            }
        }
        return t;
    });
    localStorage.setItem('winds_tickets', JSON.stringify(tickets));
    loadTickets();
}

function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTickets();
}

function filterTickets() {
    loadTickets();
}

window.onload = loadTickets;
</script>

</body>
</html>
