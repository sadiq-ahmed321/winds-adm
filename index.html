<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINDS-DEV Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a2b36;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.5rem;
            color: #e63946;
            letter-spacing: 1px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background-color: #171821;
            border: 1px solid #2a2b36;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #a0a0c0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2b36;
            font-size: 0.95rem;
        }
        th {
            color: #8c8f9e;
            background-color: #1f2029;
        }
        .btn {
            background-color: #e63946;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #d90429;
        }
        .btn-secondary {
            background-color: #2a2b36;
            color: #fff;
            margin-right: 10px;
        }
        .btn-secondary:hover {
            background-color: #3b3c4a;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f1015;
            border: 1px solid #2a2b36;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 1rem;
            margin-bottom: 15px;
            resize: vertical;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-open { background-color: #ffb703; color: #000; }
        .badge-closed { background-color: #2b9348; color: #fff; }
        
        #replySection {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>𝚁𝙰𝚉𝙴™ - BOT : ADMIN PANEL</h1>
            <button class="btn btn-secondary" onclick="loadTickets()">Refresh Tickets</button>
        </header>

        <!-- Tickets List View -->
        <div id="dashboardView" class="card">
            <h2>Support Tickets Management</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Issue Type</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ticketTableBody">
                        <!-- Dynamic tickets will load here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Reply View -->
        <div id="replySection" class="card">
            <h2>Reply to Ticket</h2>
            <p style="margin-bottom: 10px; color: #b0b0d0;" id="userInfoDisplay"></p>
            <textarea id="adminAnswerText" placeholder="Write your professional response here..."></textarea>
            <div>
                <button class="btn btn-secondary" onclick="goBackToDashboard()">Cancel</button>
                <button class="btn" onclick="executeSendMail()">Send Mail & Close Ticket</button>
            </div>
        </div>
    </div>

    <script>
        let currentActiveTicketId = null;
        let selectedUserEmail = '';
        let selectedUserName = '';

        // Load tickets on page startup
        window.onload = function() {
            loadTickets();
        };

        function loadTickets() {
            const tbody = document.getElementById('ticketTableBody');
            tbody.innerHTML = '';

            let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];

            if (tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #777;">No support tickets found.</td></tr>`;
                return;
            }

            tickets.forEach(ticket => {
                const tr = document.createElement('tr');
                const badgeClass = ticket.status === 'Closed' ? 'badge-closed' : 'badge-open';
                
                tr.innerHTML = `
                    <td>${ticket.name || 'Anonymous'}</td>
                    <td>${ticket.issueType || 'OTHER'}</td>
                    <td><span class="badge ${badgeClass}">${ticket.status || 'Open'}</span></td>
                    <td>
                        <button class="btn" onclick="openReplyPanel('${ticket.id}', '${ticket.email}', '${ticket.name}')">Reply</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openReplyPanel(id, email, name) {
            currentActiveTicketId = id;
            selectedUserEmail = email;
            selectedUserName = name;

            document.getElementById('userInfoDisplay').innerHTML = `Replying to: <strong>${name}</strong> (${email}) | Issue ID: ${id}`;
            document.getElementById('adminAnswerText').value = '';
            
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('replySection').style.display = 'block';
        }

        function goBackToDashboard() {
            document.getElementById('replySection').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadTickets();
        }

        function executeSendMail() {
            sendAnswerMail(selectedUserEmail, selectedUserName);
        }

        // Brevo API Integration Function (0% Watermark & Direct Inbox Delivery)
        function sendAnswerMail(userEmail, userName) {
            const answerText = document.getElementById('adminAnswerText').value;
            if (!answerText.trim()) {
                alert('Please write an answer before sending!');
                return;
            }

            const BREVO_API_KEY = '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';

            const payload = {
                sender: {
                    name: "WINDS Development",
                    email: "developmentwinds@gmail.com"
                },
                to: [
                    {
                        email: userEmail,
                        name: userName
                    }
                ],
                subject: "Response to your Support Ticket | WINDS-DEV",
                htmlContent: `
                    <div style="font-family: Arial, sans-serif; color: #222222; padding: 20px; line-height: 1.6;">
                        <p>Hello Dear,</p>
                        <p><strong>${userName}</strong></p>
                        
                        <div style="margin: 20px 0; font-size: 1rem; color: #333333;">
                            ${answerText}
                        </div>
                        
                        <div style="margin-top: 30px;">
                            <a href="https://dc.gg/winds.dev" target="_blank" style="background-color: #e63946; color: #ffffff; padding: 12px 24px; text-decoration: none; font-weight: bold; border-radius: 6px; display: inline-block;">
                                MEET US
                            </a>
                        </div>
                    </div>
                `
            };

            fetch('https://api.brevo.com/v3/smtp/email', {
                method: 'POST',
                headers: {
                    'accept': 'application/json',
                    'api-key': BREVO_API_KEY,
                    'content-type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.messageId) {
                    alert('Mail sent successfully via Brevo!');

                    // Update ticket status to Closed in localStorage
                    let tickets = JSON.parse(localStorage.getItem('winds_tickets')) || [];
                    tickets = tickets.map(t => {
                        if (t.id === currentActiveTicketId) {
                            t.status = 'Closed';
                        }
                        return t;
                    });
                    localStorage.setItem('winds_tickets', JSON.stringify(tickets));

                    goBackToDashboard();
                } else {
                    alert('BREVO ERROR: ' + JSON.stringify(data));
                }
            })
            .catch(error => {
                alert('FETCH ERROR: ' + error.message);
            });
        }
    </script>
</body>
</html>
